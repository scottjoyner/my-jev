[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "my-jev"
version = "0.1.0"
description = "Open System-One-style typed probabilistic decision model"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Scott Joyner"}]
dependencies = [
  "torch>=2.4",
  "transformers>=4.48",
  "pydantic>=2.8",
  "numpy>=1.26",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "cryptography>=45.0",
]
serve = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
causal = [
  "transformers>=5.5.0",
  "peft>=0.17",
  "accelerate>=1.0",
]
systemone = [
  "mcp>=2.1",
]
signing = [
  "cryptography>=45.0",
]

[project.scripts]
my-jev = "my_jev.cli:main"
my-jev-train = "my_jev.train:main"
my-jev-train-causal = "my_jev.train_causal:main"
my-jev-eval = "my_jev.evaluate:main"
my-jev-calibrate = "my_jev.calibrate:main"
my-jev-label = "my_jev.label:main"
my-jev-split = "my_jev.split:main"
my-jev-synth = "my_jev.synth:main"
my-jev-manifest = "my_jev.manifest:main"
my-jev-data-audit = "my_jev.data_audit:main"
my-jev-agentic-synth = "my_jev.agentic_synth:main"
my-jev-benchmark = "my_jev.benchmark:main"
my-jev-serve = "my_jev.server:main"
my-jev-shadow-import = "my_jev.shadow_import:main"
my-jev-shadow-replay = "my_jev.shadow_replay:main"
my-jev-shadow-evaluate = "my_jev.shadow_evaluation:main"
my-jev-review = "my_jev.review:main"
my-jev-adjudicate = "my_jev.adjudicate:main"
my-jev-experiment = "my_jev.experiment:main"
my-jev-compare = "my_jev.compare:main"
my-jev-doctor = "my_jev.doctor:main"
my-jev-baseline-evidence = "my_jev.baseline_evidence:main"
my-jev-scale-readiness = "my_jev.scale_readiness:main"
my-jev-bonsai-probe = "my_jev.bonsai_probe:main"
my-jev-bonsai-capture = "my_jev.bonsai_native:main"
my-jev-bonsai-smoke = "my_jev.bonsai_smoke:main"
my-jev-fleet-synth = "my_jev.fleet_synth:main"
my-jev-fleet-benchmark = "my_jev.fleet_benchmark:main"
my-jev-fleet-benchmark-states = "my_jev.fleet_benchmark_states:main"
my-jev-fleet-prepare = "my_jev.fleet_prepare:main"
my-jev-mix = "my_jev.mix:main"
my-jev-prepare = "my_jev.prepare:main"
my-jev-uhp-fixture = "my_jev.uhp_fixture:main"
my-jev-uhp-fixture-suite = "my_jev.uhp_fixture_suite:main"
my-jev-heartbeat-snapshot = "my_jev.heartbeat_snapshot_cli:main"
my-jev-heartbeat-mcp = "my_jev.heartbeat_mcp:main"
my-jev-heartbeat-compile = "my_jev.heartbeat_compile_cli:main"
my-jev-harnessrouter-probe = "my_jev.harnessrouter_probe:main"
my-jev-sign-uhp-response = "my_jev.uhp_signing:main"

[tool.hatch.build.targets.wheel]
packages = ["src/my_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
