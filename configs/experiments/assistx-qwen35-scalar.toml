[experiment]
name = "assistx-policy-qwen35-scalar"
output_root = "runs/experiments"
registry_path = "runs/experiments/registry.json"
lock_dir = "runs/experiments/.locks"
parent = "latest_promoted"

[model]
backend = "causal_scalar"
backbone = "Qwen/Qwen3.5-4B-Base"
lora_r = 16
lora_alpha = 32
lora_dropout = 0.05
target_modules = "all-linear"

[data]
train = "data/assistx-policy-v1/train.jsonl"
validation = "data/assistx-policy-v1/validation.jsonl"
calibration = "data/assistx-policy-v1/calibration.jsonl"
test = "data/assistx-policy-v1/test.jsonl"

[train]
epochs = 2
batch_size = 1
grad_accum = 16
learning_rate = 0.0001
weight_decay = 0.01
max_sequence_length = 1024
seed = 17
bf16 = true
freeze_backbone = false
gradient_checkpointing = true

[benchmark]
batch_size = 2

# Regression is within the Qwen scalar family only. The first run has no
# parent; later runs must retain the same evaluation sets and avoid backsliding.
[regression]
require_same_evaluation_hashes = true
max_accuracy_drop = 0.02
max_ece_increase = 0.02
max_nll_increase = 0.05
max_brier_increase = 0.05
max_policy_consistency_violation_rate_increase = 0.01
max_batch_ms_p95_ratio = 1.25
max_decisions_per_second_drop_fraction = 0.20

# Same behavioral gates as the encoder lane. No absolute throughput floor yet:
# this correctness-first cross-encoder will be slower until cache branching.
[gates]
min_accuracy = 0.80
max_ece = 0.10
max_nll = 0.80
max_brier = 0.30
min_accuracy_delta_vs_shuffled = 0.15
min_accuracy_delta_vs_uniform = 0.20
min_choice_order_top1_agreement = 0.98
max_choice_order_mean_abs_delta = 0.02
max_policy_consistency_violation_rate = 0.02
